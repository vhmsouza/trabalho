<main class="cadastro">
    <section class="cadastro-container">
        <h1>Criar sua conta</h1>
        <p>Cadastre-se para aproveitar!</p>

        <form [formGroup]="formCadastro" (ngSubmit)="cadastrar()">
            <div class="campo">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" formControlName="nome" placeholder="Digite seu nome...">
                <span *ngIf="formCadastro.get('nome')?.invalid && formCadastro.get('nome')?.touched" class="erro">
                    O campo nome é obrigatório.
                </span>
            </div>

            <div class="campo">
                <label for="email">Email:</label>
                <input type="email" id="email" formControlName="email" placeholder="Digite seu email...">
                <span *ngIf="formCadastro.get('email')?.hasError('required') && formCadastro.get('email')?.touched" class="erro">
                    O campo email é obrigatório.
                </span>
                <span *ngIf="formCadastro.get('email')?.hasError('email') && formCadastro.get('email')?.touched" class="erro">
                    Informe um email válido.
                </span>
            </div>

            <div class="campo">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" formControlName="senha" placeholder="Digite sua senha..." maxlength="4">
                <span *ngIf="formCadastro.get('senha')?.invalid && formCadastro.get('senha')?.touched" class="erro">
                    O campo senha é obrigatório.
                </span>
            </div>

            <div class="campo">
                <label for="confirmarSenha">Confirme sua senha:</label>
                <input type="password" id="confirmarSenha" formControlName="confirmarSenha" placeholder="Confirme sua senha..." maxlength="4">
                <span *ngIf="formCadastro.get('confirmarSenha')?.invalid && formCadastro.get('confirmarSenha')?.touched" class="erro">
                    A confirmação de senha é obrigatória.
                </span>
            </div>

            <button type="button" (click)="cadastrar()">Criar conta</button>
        </form>

        <p class="login">Já possui uma conta?
            <a routerLink="/login">Entrar</a>
        </p>
    </section>
</main>
